AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tesla browser client-decode PoC — SPA + /videos + /packs in S3 behind CloudFront (OAC).
  Playback is fully client-side. Optional (EnableLogs=true): same-origin
  POST /api/logs → HTTP API → Lambda → CloudWatch Logs, for debug logs only.

Parameters:
  EnableLogs:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      true = also create the optional debug-log endpoint (HTTP API + Lambda + log group,
      CloudFront /api/* behavior). false = S3 + CloudFront only.
  ProjectName:
    Type: String
    Default: tesla-browser-client-decode-poc
  LogGroupName:
    Type: String
    Default: ""
    Description: CloudWatch log group for browser logs. Empty = /<ProjectName>/browser.
  BucketPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{0,20}$"
    Description: Optional S3 bucket name prefix (bucket = <prefix>-<ProjectName>). Empty = CloudFormation-generated name.

Conditions:
  LogsEnabled: !Equals [!Ref EnableLogs, "true"]
  DefaultLogGroup: !Equals [!Ref LogGroupName, ""]
  AutoBucketName: !Equals [!Ref BucketPrefix, ""]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [AutoBucketName, !Ref "AWS::NoValue", !Sub "${BucketPrefix}-${ProjectName}"]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: OAC for client-decode PoC bucket

  BrowserLogGroup:
    Condition: LogsEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If [DefaultLogGroup, !Sub "/${ProjectName}/browser", !Ref LogGroupName]
      RetentionInDays: 14

  LogIngestRole:
    Condition: LogsEnabled
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PutBrowserLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt BrowserLogGroup.Arn
                  - !Sub "${BrowserLogGroup.Arn}:*"

  LogIngestFn:
    Condition: LogsEnabled
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-log-ingest"
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt LogIngestRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          LOG_GROUP: !Ref BrowserLogGroup
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "headers": {"content-type": "application/json"}, "body": '{"error":"pending code upload"}'}

  LogHttpApi:
    Condition: LogsEnabled
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-logs"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 86400

  LogIngestIntegration:
    Condition: LogsEnabled
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LogHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LogIngestFn.Arn}/invocations"
      PayloadFormatVersion: "2.0"
      IntegrationMethod: POST

  LogRoutePost:
    Condition: LogsEnabled
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LogHttpApi
      RouteKey: "POST /api/logs"
      Target: !Sub "integrations/${LogIngestIntegration}"

  LogRouteOptions:
    Condition: LogsEnabled
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LogHttpApi
      RouteKey: "OPTIONS /api/logs"
      Target: !Sub "integrations/${LogIngestIntegration}"

  LogStage:
    Condition: LogsEnabled
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref LogHttpApi
      StageName: "$default"
      AutoDeploy: true

  LogIngestPermission:
    Condition: LogsEnabled
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LogIngestFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LogHttpApi}/*"

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !If [LogsEnabled, !Sub "${ProjectName} SPA + /videos + /packs + /api/logs", !Sub "${ProjectName} SPA + /videos + /packs"]
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - LogsEnabled
            - Id: LogsApiOrigin
              DomainName: !Sub "${LogHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        CacheBehaviors:
          - !If
            - LogsEnabled
            - PathPattern: api/*
              TargetOriginId: LogsApiOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              # CachingDisabled
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              # AllViewerExceptHostHeader — Host must be the API Gateway domain
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            - !Ref "AWS::NoValue"
          - PathPattern: packs/*
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
          - PathPattern: videos/*
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
          - PathPattern: "*.mp4"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  LogsEnabled:
    Value: !Ref EnableLogs
  BucketName:
    Value: !Ref MediaBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  SiteURL:
    Value: !Sub "https://${Distribution.DomainName}"
  BrowserLogGroup:
    Condition: LogsEnabled
    Value: !Ref BrowserLogGroup
  LogIngestUrl:
    Condition: LogsEnabled
    Value: !Sub "https://${Distribution.DomainName}/api/logs"
  LogApiEndpoint:
    Condition: LogsEnabled
    Value: !Sub "https://${LogHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  LogIngestFnName:
    Condition: LogsEnabled
    Value: !Ref LogIngestFn
